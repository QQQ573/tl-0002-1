version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "8095:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - app-network

  client:
    build: ./client
    ports:
      - "5193:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
